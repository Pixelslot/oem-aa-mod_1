name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Build nav16_test (host g++)
        run: make -C test nav16_test

      - name: Run nav16_test
        run: ./test/build/nav16_test

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Resolve m3-toolchain submodule commit
        id: toolchain
        run: echo "sha=$(git ls-tree HEAD -- mazda/m3-toolchain | awk '{print $3}')" >> "$GITHUB_OUTPUT"

      - name: Cache m3-toolchain (keyed on its submodule commit)
        id: toolchain-cache
        uses: actions/cache@v4
        with:
          path: mazda/m3-toolchain
          key: m3-toolchain-${{ steps.toolchain.outputs.sha }}

      - name: Fetch m3-toolchain (cache miss only)
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          url=$(git config -f .gitmodules submodule.mazda/m3-toolchain.url)
          rm -rf mazda/m3-toolchain
          git clone --filter=blob:none "$url" mazda/m3-toolchain
          git -C mazda/m3-toolchain checkout --detach "${{ steps.toolchain.outputs.sha }}"
          rm -rf mazda/m3-toolchain/.git

      - name: Verify the cross toolchain is present and runnable
        run: |
          set -euo pipefail
          gpp=mazda/m3-toolchain/bin/arm-cortexa9_neon-linux-gnueabi-g++
          if [ ! -x "$gpp" ]; then
            echo "::error::$gpp missing — m3-toolchain submodule did not check out"
            exit 1
          fi
          if ! file "$gpp" | grep -q 'ELF'; then
            echo "::error::$gpp is not an ELF binary (Git LFS blobs not pulled?)"
            file "$gpp"
            exit 1
          fi
          "$gpp" --version | head -1

      - name: Build (release + debug)
        run: make -C mazda -j"$(nproc)" all

      - name: Stage release files
        run: |
          set -euo pipefail
          rm -rf staging
          mkdir -p staging
          cp mazda/build/release/libpatch-*.so staging/
          cp -r resources staging/
          # Catch a build that "succeeds" but links for the wrong target.
          for so in staging/libpatch-*.so; do
            file "$so"
            file "$so" | grep -q 'ELF 32-bit.*ARM' || {
              echo "::error::$so is not an ARM shared object"; exit 1; }
          done

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: oem-aa-mod-release
          path: |
            staging/**
          retention-days: 14
          if-no-files-found: error

      - name: Stage debug files
        run: |
          set -euo pipefail
          rm -rf staging-debug
          mkdir -p staging-debug
          cp mazda/build/debug/libpatch-*.so staging-debug/
          cp -r resources staging-debug/

      - name: Upload debug artifact
        uses: actions/upload-artifact@v4
        with:
          name: oem-aa-mod-debug
          path: |
            staging-debug/**
          retention-days: 14
          if-no-files-found: error
